proxy_cache_path /var/cache/nginx/indevolt levels=1 keys_zone=indevolt:1m max_size=10m inactive=1m use_temp_path=off;

server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    # ── Proxy Indevolt appareil (IP dynamique) ──────────────────
    # GetData : lecture mise en cache 10s et partagée entre tous les clients
    # (la batterie coupe la connexion quand plusieurs clients l'interrogent).
    # Doit rester AVANT la location générique ci-dessous.
    location ~ ^/indevolt-api/(?<devip>192\.168\.1\.[0-9]+)/(?<devpath>Indevolt\.GetData)$ {
        proxy_pass http://$devip:8080/rpc/$devpath$is_args$args;
        proxy_connect_timeout 3s;
        proxy_read_timeout    7s;
        error_page 502 504 = @upstream_down;

        proxy_cache           indevolt;
        proxy_cache_methods   GET HEAD POST;
        proxy_cache_key       "$devip$devpath$args";
        proxy_cache_valid     200 10s;
        proxy_cache_lock      on;
        proxy_cache_lock_timeout 7s;
        proxy_cache_use_stale updating;
        add_header X-Cache-Status $upstream_cache_status always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # Tout le reste (SetData, etc.) : JAMAIS de cache
    # Captures nommées pour compatibilité nginx
    location ~ ^/indevolt-api/(?<devip>192\.168\.1\.[0-9]+)/(?<devpath>.+)$ {
        proxy_pass http://$devip:8080/rpc/$devpath$is_args$args;
        proxy_connect_timeout 3s;
        proxy_read_timeout    7s;
        error_page 502 504 = @upstream_down;
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # Bloquer toute IP hors 192.168.1.x (ex: 10.x, 127.x, etc.)
    location ~ ^/indevolt-api/ {
        return 403;
    }

    # ── Proxy OpenDTU (IP dynamique, captures nommées) ─────────
    location ~ ^/opendtu-api/(?<dtuip>192\.168\.1\.[0-9]+)/(?<dtupath>.+)$ {
        proxy_pass http://$dtuip/$dtupath$is_args$args;
        proxy_connect_timeout 3s;
        proxy_read_timeout    7s;
        error_page 502 504 = @upstream_down;
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # Bloquer toute IP OpenDTU hors 192.168.1.x
    location ~ ^/opendtu-api/ {
        return 403;
    }

    # ── Proxy Settings & Store API (sidecar Python Docker) ─────
    location /api/ {
        proxy_pass http://settings-api:8081/api/;
        proxy_connect_timeout 3s;
        proxy_read_timeout    5s;
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # Vraie erreur 502 JSON quand l'appareil est injoignable ou occupé
    location @upstream_down {
        default_type application/json;
        return 502 '{"error":"Appareil injoignable ou occupé","hint":"Réessai au prochain cycle"}';
    }
}
